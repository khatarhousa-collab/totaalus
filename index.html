      html {

          radial-gradient(at 100% 50%, hsla(38,80%,35%,0.2) 0, transparent 50%),
          radial-gradient(at 0% 100%, hsla(30,50%,20%,0.3) 0, transparent 50%),
          radial-gradient(at 50% 100%, hsla(43,70%,40%,0.2) 0, transparent 50%),
          radial-gradient(at 100% 100%, hsla(45,80%,45%,0.3) 0, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
      }
      .glass-card {
        background: rgba(20, 18, 12, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.15);
      }
      .glass-card-dark {
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.15);
      }
      .text-italics {
        font-style: italic;
        font-weight: 300;
      }
      .marquee-container {
        display: flex;
        overflow: hidden;
        user-select: none;
        gap: 2rem;
      }
      .marquee-content {
        flex-shrink: 0;
        display: flex;
        justify-content: space-around;
        gap: 2rem;
        min-width: 100%;
        animation: scroll 40s linear infinite;
      }
      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(calc(-100% - 2rem)); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.5) translateY(10px); }
        70% { transform: scale(1.05) translateY(-2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .grid-line {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 1px;
        background-color: rgba(255,255,255,0.1);
        z-index: -1;
      }
      .grid-line-left { left: 5%; }
      .grid-line-right { right: 5%; }
      
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.8s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      
      @media (max-width: 1024px) {
        .grid-line { display: none; }
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 15px rgba(245,158,11,0.2), 0 0 30px rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.5); }
        50% { box-shadow: 0 0 25px rgba(245,158,11,0.4), 0 0 50px rgba(245,158,11,0.2); border-color: rgba(245,158,11,0.8); }
      }
      @keyframes bounceArrow {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(4px); }
      }
      .bonus-btn {
        animation: pulseGlow 2s ease-in-out infinite;
      }
      .bonus-btn .shimmer-bar {
        animation: shimmer 3s ease-in-out infinite;
      }
      .bonus-btn .bounce-arrow {
        animation: bounceArrow 1.5s ease-in-out infinite;
      }
    </style>
