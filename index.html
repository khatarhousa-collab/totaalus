    <title>IPTVTotaal - Premium IPTV voor iedereen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Geist', sans-serif;
        color: #1a1310;
        overflow-x: hidden;
        background-color: #faf6ed;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Gasoek One', 'Geist', sans-serif;
        font-weight: 400 !important;
        letter-spacing: normal !important;
      }
      .font-logo {
        font-family: 'Gasoek One', 'Geist', sans-serif;
        letter-spacing: normal;
      }

      /* --- Brutalist card system (hard offset shadow, no blur) --- */
      /* .glass-card = light card (the default). .glass-card-dark stays a deliberate dark accent panel. */
      .glass-card, .card-brutal {
        background: #fffcf5;
        border: 3px solid rgba(26,19,16,0.85);
        border-radius: 24px;
        box-shadow: 7px 7px 0 0 rgba(245,158,11, 0.55);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .glass-card-dark {
        background: #14100a;
        border: 3px solid rgba(245,158,11, 0.4);
        border-radius: 24px;
        box-shadow: 7px 7px 0 0 rgba(245,158,11, 0.3);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        color: #fff;
      }
      /* badge-brutal is dark-text-on-light by default; restore light text when nested in a dark accent panel */
      .glass-card-dark .badge-brutal {
        border-color: rgba(245,158,11, 0.6);
        background: rgba(245,158,11, 0.12);
        color: #E9C766;
      }
      .card-brutal-hover:hover {
        transform: translate(-3px, -3px);
        box-shadow: 10px 10px 0 0 rgba(245,158,11, 0.7);
      }

      /* --- Brutalist pill badge (Creem-style "eyebrow" label) --- */
      .badge-brutal {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.4rem 1rem;
        border-radius: 999px;
        border: 2px solid rgba(180,120,10,0.5);
        background: rgba(245,158,11, 0.12);
        color: #8a5a09;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        white-space: nowrap;
      }

      /* --- Brutalist button: solid border + hard offset shadow that "presses in" on hover --- */
      .btn-brutal {
        position: relative;
        border: 3px solid #000;
        border-radius: 16px;
        box-shadow: 6px 6px 0 0 #F59E0B;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn-brutal:hover {
        transform: translate(3px, 3px);
        box-shadow: 3px 3px 0 0 #F59E0B;
      }
      .btn-brutal:active {
        transform: translate(6px, 6px);
        box-shadow: 0 0 0 0 #F59E0B;
      }
      .btn-brutal-outline {
        position: relative;
        border: 3px solid rgba(245,158,11, 0.7);
        border-radius: 16px;
        box-shadow: 6px 6px 0 0 rgba(245,158,11, 0.5);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn-brutal-outline:hover {
        transform: translate(3px, 3px);
        box-shadow: 3px 3px 0 0 rgba(245,158,11, 0.5);
      }

      /* --- Wavy section divider, Creem-style --- */
      .wave-divider {
        display: block;
        width: 100%;
        height: 60px;
        line-height: 0;
      }
      .wave-divider svg {
        width: 100%;
        height: 100%;
      }

      .text-italics {
        font-style: italic;
        font-weight: 300;
      }
      .marquee-container {
        display: flex;
        overflow: hidden;
        user-select: none;
        gap: 2rem;
      }
      .marquee-content {
        flex-shrink: 0;
        display: flex;
        justify-content: space-around;
        gap: 2rem;
        min-width: 100%;
        animation: scroll 40s linear infinite;
      }
      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(calc(-100% - 2rem)); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.5) translateY(10px); }
        70% { transform: scale(1.05) translateY(-2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .grid-line {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 1px;
        background-color: rgba(26,19,16,0.08);
        z-index: -1;
      }
      .grid-line-left { left: 5%; }
      .grid-line-right { right: 5%; }
      
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.8s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      
      @media (max-width: 1024px) {
        .grid-line { display: none; }
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 15px rgba(245,158,11,0.2), 0 0 30px rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.5); }
        50% { box-shadow: 0 0 25px rgba(245,158,11,0.4), 0 0 50px rgba(245,158,11,0.2); border-color: rgba(245,158,11,0.8); }
      }
      @keyframes bounceArrow {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(4px); }
      }
      .bonus-btn {
        animation: pulseGlow 2s ease-in-out infinite;
      }
      .bonus-btn .shimmer-bar {
        animation: shimmer 3s ease-in-out infinite;
      }
      .bonus-btn .bounce-arrow {
        animation: bounceArrow 1.5s ease-in-out infinite;
      }
    </style>
